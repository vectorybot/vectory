# Release workflow for the Vectory player CLI.
#
# Trigger: pushing a tag like `v0.2.0`, or manual dispatch from the Actions tab.
# Build matrix: Linux x86_64, macOS aarch64 (Apple Silicon), Windows x86_64.
#
# At build time, SUPABASE_URL and SUPABASE_ANON_KEY are pulled from repo
# secrets and exposed as build-time env vars. `config.rs` reads them via
# `option_env!`, baking the values into the resulting binary so end users
# need no config to play. The values never appear in source or git history.
#
# Setup once, in the GitHub UI:
#   Settings → Secrets and variables → Actions → New repository secret
#     - SUPABASE_URL      = https://<project>.supabase.co
#     - SUPABASE_ANON_KEY = <the public anon key>
#
# Cutting a release:
#   git tag v0.2.0 && git push origin v0.2.0

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vectory-x86_64-linux
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vectory-aarch64-macos
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vectory-x86_64-windows
            archive: zip
          # Intel macOS (x86_64-apple-darwin) was dropped in v0.1.0: the
          # macos-13 hosted runner pool was unavailable / starved and jobs
          # queued indefinitely. Apple Silicon covers the vast majority of
          # Mac users; add an Intel target back via cross-compile from
          # macos-latest if anyone asks.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        # SUPABASE_URL / SUPABASE_ANON_KEY are read at compile time via
        # `option_env!` and baked into the binary. The Supabase anon key is
        # designed to be public (protected by RLS, not secrecy) — this is the
        # intended distribution channel.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: cargo build --release --target ${{ matrix.target }} -p vectory

      - name: Strip binary (Unix)
        # Skip on Windows: MSVC PE binaries don't strip the same way and the
        # size delta is minor.
        if: matrix.archive == 'tar.gz'
        run: strip target/${{ matrix.target }}/release/vectory

      - name: Package tarball (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" vectory

      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/vectory.exe" `
            -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.${{ matrix.archive }}
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          shasum -a 256 vectory-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/vectory-*.tar.gz
            dist/vectory-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
